server:
  port: ${PORT:8080}

spring:
  application:
    name: sharing-food-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  mail:
    host: ${MAIL_HOST:${SPRING_MAIL_HOST:}}
    port: ${MAIL_PORT:${SPRING_MAIL_PORT:587}}
    username: ${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
    password: ${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLXNoYXJpbmctZm9vZC1zcHJlYWRpbmctbG92ZS1uZ28tcGxhdGZvcm0=}
    expiration-ms: 86400000 # 24 hours
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  admin:
    email: ${ADMIN_EMAIL:admin@sharingfood.org}
    password: ${ADMIN_PASSWORD:Admin@SharingFood2026!}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://sharing-food-production.up.railway.app}
  frontend:
    url: ${FRONTEND_URL:${APP_FRONTEND_URL:https://sharing-food-production.up.railway.app}}
  otp:
    demo-mode: ${ENABLE_DEMO_OTP:${DEMO_MODE:${ALLOW_TEST_OTP:true}}}
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    sendgrid-api-key: ${SENDGRID_API_KEY:}
    from-email: ${MAIL_FROM:${MAIL_USERNAME:${SPRING_MAIL_USERNAME:noreply@sharingfood.org}}}
  sms:
    provider: ${SMS_PROVIDER:AUTO}
    msg91-auth-key: ${MSG91_AUTH_KEY:${SMS_AUTH_KEY:${SMS_API_KEY:}}}
    msg91-template-id: ${MSG91_TEMPLATE_ID:${SMS_TEMPLATE_ID:}}
    msg91-sender-id: ${MSG91_SENDER_ID:${SMS_SENDER_ID:SHFOOD}}
    fast2sms-api-key: ${FAST2SMS_API_KEY:${SMS_API_KEY:}}
    twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
    twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
    twilio-from-number: ${TWILIO_FROM_NUMBER:}
